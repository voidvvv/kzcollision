buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
  }
}

plugins {
  id 'com.gradleup.nmcp.aggregation' version '1.4.4'
}

repositories {
  mavenCentral()
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 11
  java.targetCompatibility = 11
  compileJava {
    options.incremental = true
  }
}

configure([project(':core'), project(':sdk')]) {
  apply plugin: 'maven-publish'
  apply plugin: 'signing'
  apply plugin: 'com.gradleup.nmcp'

  group = findProperty('publishGroup') ?: System.getenv('PUBLISH_GROUP') ?: 'io.github.voidvvv'
  version = "$projectVersion"
  ext.appName = 'kzcollision'
  ext.centralPublishRequested = {
    gradle.startParameter.taskNames.any { taskName ->
      taskName.toLowerCase(Locale.ROOT).contains('centralportal')
    }
  }

  java {
    withSourcesJar()
    withJavadocJar()
  }

  javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        groupId = project.group
        artifactId = project.path == ':core' ? "${appName}-core" : "${appName}-sdk"
        version = project.version

        pom {
          name = project.path == ':core' ? 'KZCollision Core' : 'KZCollision SDK'
          description = project.path == ':core'
              ? 'Core data model and JSON serialization for KZCollision.'
              : 'Runtime SDK for loading, rendering, and querying KZCollision animation collision data.'
          url = findProperty('pomUrl') ?: 'https://github.com/voidvvv/kzcollision'

          licenses {
            license {
              name = findProperty('pomLicenseName') ?: 'The Apache License, Version 2.0'
              url = findProperty('pomLicenseUrl') ?: 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }

          developers {
            developer {
              id = findProperty('pomDeveloperId') ?: 'voidvvv'
              name = findProperty('pomDeveloperName') ?: 'voidvvv'
              email = findProperty('pomDeveloperEmail') ?: 'voidvvv01@gmail.com'
            }
          }

          scm {
            connection = findProperty('pomScmConnection')
                ?: 'scm:git:https://github.com/voidvvv/kzcollision.git'
            developerConnection = findProperty('pomScmDeveloperConnection')
                ?: 'scm:git:ssh://git@github.com/voidvvv/kzcollision.git'
            url = findProperty('pomScmUrl') ?: 'https://github.com/voidvvv/kzcollision'
          }
        }
      }
    }
  }

  signing {
    required { centralPublishRequested() }

    def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
    def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
    if (signingKey && signingKey.contains('BEGIN PGP PRIVATE KEY BLOCK')) {
      useInMemoryPgpKeys(signingKey, signingPassword)
    } else {
      if (signingKey) {
        project.ext['signing.gnupg.keyName'] = signingKey
      }
      if (signingPassword) {
        project.ext['signing.gnupg.passphrase'] = signingPassword
      }
      useGpgCmd()
    }
    sign publishing.publications.mavenJava
  }
}

nmcpAggregation {
  centralPortal {
    username = findProperty('centralUsername') ?: System.getenv('CENTRAL_USERNAME')
    password = findProperty('centralPassword') ?: System.getenv('CENTRAL_PASSWORD')
    publishingType = findProperty('centralPublishingType') ?: 'USER_MANAGED'
    publicationName = findProperty('centralPublicationName') ?: "kzcollision:${projectVersion}"
  }
}

dependencies {
  nmcpAggregation project(':core')
  nmcpAggregation project(':sdk')
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'kzcollision'
  repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'kzcollision-parent'
